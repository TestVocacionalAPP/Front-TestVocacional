<div class="container mt-5">
  <h2 class="text-center mb-4">Historial de Compras</h2>

  <!-- Indicador de carga centrado -->
  <div *ngIf="loading" class="text-center loading-spinner">
    <mat-progress-spinner mode="indeterminate" color="primary"></mat-progress-spinner>
  </div>

  <table class="table table-striped" *ngIf="!loading">
    <thead>
      <tr>
        <th>N°</th>
        <th>Producto</th>
        <th>Precio</th>
        <th>Fecha</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let compra of historialCompras; let i = index">
        <td>{{ i + 1 }}</td> <!-- Enumeración -->
        <td>{{ compra.recursoTitulo }}</td>
        <td>{{ compra.precio | currency }}</td>
        <td>{{ compra.fecha | date: 'short' }}</td>
      </tr>
    </tbody>
  </table>
</div>
