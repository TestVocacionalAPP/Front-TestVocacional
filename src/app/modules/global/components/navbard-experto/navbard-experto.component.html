<mat-toolbar class="custom-toolbar">
  <!-- Logo y nombre -->
  <span class="app-name">Test Vocacional</span>
  <span class="welcome-text" *ngIf="isLoggedIn()">Bienvenido Experto</span>

  <span class="example-spacer"></span>

  <!-- Navegación Desktop -->
  <div class="desktop-nav" *ngIf="isLoggedIn()">
    <button mat-icon-button [matMenuTriggerFor]="notificacionesMenu" aria-label="Notificaciones" class="notification-btn">
      <mat-icon>notifications</mat-icon>
      <span *ngIf="notificaciones.length" class="notification-badge">{{notificaciones.length}}</span>
    </button>

    <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="Menú de usuario">
      <mat-icon>settings</mat-icon>
    </button>
  </div>

  <!-- Botón Hamburguesa -->
  <button class="hamburger-menu" (click)="toggleMenu()" *ngIf="isLoggedIn()">
    <mat-icon>menu</mat-icon>
  </button>
</mat-toolbar>

<!-- Menú Móvil -->
<div class="mobile-nav" [class.open]="menuOpen">
  <div class="mobile-nav-content">
    <button mat-button routerLink="/experto/perfil-experto" (click)="toggleMenu()">
      <mat-icon>account_circle</mat-icon>
      <span>Ver perfil</span>
    </button>

    <button mat-button (click)="toggleMenu()" [matMenuTriggerFor]="notificacionesMenu">
      <mat-icon>notifications</mat-icon>
      <span>Notificaciones</span>
      <span *ngIf="notificaciones.length" class="mobile-badge">{{notificaciones.length}}</span>
    </button>

    <button mat-button (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Cerrar sesión</span>
    </button>
  </div>
</div>

<!-- Menús desplegables -->
<mat-menu #notificacionesMenu="matMenu">
  <ng-container *ngIf="notificaciones.length > 0; else noNotificaciones">
    <button mat-menu-item *ngFor="let notificacion of notificaciones">
      <mat-icon>notifications_active</mat-icon>
      <span>{{ notificacion.asunto }} - {{ notificacion.estado }}</span>
    </button>
  </ng-container>
  <ng-template #noNotificaciones>
    <button mat-menu-item disabled>
      <mat-icon>notifications_off</mat-icon>
      No hay notificaciones
    </button>
  </ng-template>
</mat-menu>

<mat-menu #userMenu="matMenu">
  <button mat-menu-item routerLink="/experto/perfil-experto">
    <mat-icon>account_circle</mat-icon>
    <span>Ver perfil</span>
  </button>
  <button mat-menu-item (click)="logout()">
    <mat-icon>logout</mat-icon>
    <span>Cerrar sesión</span>
  </button>
</mat-menu>

<router-outlet></router-outlet>
